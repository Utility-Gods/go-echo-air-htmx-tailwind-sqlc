version: '3'

vars:
  BINARY_NAME: app
  BUILD_DIR: bin
  TAILWIND_VERSION: v4.0.0-alpha.3

tasks:
  default:
    cmds:
      - task: dev

  install-tools:
    cmds:
      - go install github.com/cosmtrek/air@latest
      - go install github.com/a-h/templ/cmd/templ@latest
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - mkdir -p bin
      - curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
      - chmod +x tailwindcss-linux-x64
      - mv tailwindcss-linux-x64 bin/tailwindcss
    status:
      - test -f bin/tailwindcss
    desc: Install required development tools

  download-deps:
    cmds:
      - go mod download
      - go mod tidy
    desc: Download Go dependencies

  build:
    cmds:
      - task: css-build
      - task: templ-generate
      - go build -o bin/server cmd/main.go
    desc: Build the application

  dev:
    cmds:
      - bash -c "task css-watch & task templ-watch & air"
    desc: Start development server with hot reload

  css-watch:
    cmds:
      - ./bin/tailwindcss -i ./static/css/input.css -o ./static/css/output.css --watch
    desc: Watch and compile Tailwind CSS

  css-build:
    cmds:
      - ./bin/tailwindcss -i ./static/css/input.css -o ./static/css/output.css --minify
    desc: Build and minify Tailwind CSS

  templ-generate:
    cmds:
      - templ generate
    desc: Generate Go code from templ templates

  templ-watch:
    cmds:
      - templ generate --watch
    desc: Watch and generate Go code from templ templates

  # Database tasks
  db-docker-up:
    cmds:
      - docker-compose up -d postgres

  db-docker-down:
    cmds:
      - docker-compose down

  db-create:
    cmds:
      - createdb {{.DB_NAME}}
    vars:
      DB_NAME:
        sh: echo ${POSTGRES_DB:-photogo}

  db-drop:
    cmds:
      - dropdb {{.DB_NAME}}
    vars:
      DB_NAME:
        sh: echo ${POSTGRES_DB:-photogo}

  migrate-create:
    cmds:
      - migrate create -ext sql -dir internal/database/migrations -seq {{.CLI_ARGS}}
    preconditions:
      - sh: "[ ! -z \"{{.CLI_ARGS}}\" ]"
        msg: "Migration name is required. Usage: task migrate-create -- <migration_name>"

  migrate-up:
    cmds:
      - migrate -path internal/database/migrations -database "{{.DATABASE_URL}}" up
    vars:
      DATABASE_URL:
        sh: echo ${DATABASE_URL:-postgres://postgres:postgres@localhost:5432/photogo?sslmode=disable}

  migrate-down:
    cmds:
      - migrate -path internal/database/migrations -database "{{.DATABASE_URL}}" down
    vars:
      DATABASE_URL:
        sh: echo ${DATABASE_URL:-postgres://postgres:postgres@localhost:5432/photogo?sslmode=disable}

  migrate-force:
    cmds:
      - migrate -path internal/database/migrations -database "{{.DATABASE_URL}}" force {{.CLI_ARGS}}
    vars:
      DATABASE_URL:
        sh: echo ${DATABASE_URL:-postgres://postgres:postgres@localhost:5432/photogo?sslmode=disable}
    preconditions:
      - sh: "[ ! -z \"{{.CLI_ARGS}}\" ]"
        msg: "Version number is required. Usage: task migrate-force -- <version>"

  migrate-status:
    cmds:
      - migrate -path internal/database/migrations -database "{{.DATABASE_URL}}" version
    vars:
      DATABASE_URL:
        sh: echo ${DATABASE_URL:-postgres://postgres:postgres@localhost:5432/photogo?sslmode=disable}

  # Generate SQL code
  sqlc-generate:
    cmds:
      - sqlc generate

  clean:
    cmds:
      - rm -rf {{.BUILD_DIR}}/*
      - rm -rf tmp/ 